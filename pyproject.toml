[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "e2a-lite"
version = "1.7.3"
description = "电子书转有声书：句级精确字幕、句子级缓存、质检脚本，无显卡也能跑"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "RUNZEAI" }]
keywords = ["tts", "audiobook", "piper", "subtitle", "srt"]
dependencies = ["piper-tts[alignment]>=1.4.2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
e2a-lite = "tts:main"

[project.urls]
Homepage = "https://q1z2q3-debug.github.io/e2a-lite/"
Repository = "https://github.com/q1z2q3-debug/e2a-lite"

[tool.setuptools]
py-modules = ["tts"]
